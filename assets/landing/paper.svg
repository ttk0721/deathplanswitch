<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .37  0 0 0 0 .29  0 0 0 .5 -.12"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .35" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .36  0 0 0 .45 -.14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f1ebdf"/>
  <rect width="1600" height="1000" filter="url(#fibre)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
