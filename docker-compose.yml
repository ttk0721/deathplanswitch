x-healthcheck: &hc
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  web:
    image: ${DPS_IMAGE:-ghcr.io/ttk0721/deathplanswitch:latest}
    init: true
    restart: unless-stopped
    command: web
    ports: ["${DPS_PORT:-8080}:80"]
    volumes: ["./data:/data"]
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    healthcheck:
      test: ["CMD", "php", "/var/www/html/bin/healthcheck.php", "web"]
      <<: *hc

  scheduler:
    image: ${DPS_IMAGE:-ghcr.io/ttk0721/deathplanswitch:latest}
    init: true
    restart: unless-stopped
    command: scheduler
    volumes: ["./data:/data"]
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    healthcheck:
      test: ["CMD", "php", "/var/www/html/bin/healthcheck.php", "scheduler"]
      <<: *hc
